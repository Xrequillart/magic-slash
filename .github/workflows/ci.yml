name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate commits
        run: |
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./install"
          severity: warning

      - name: Run yamllint
        run: |
          pip install --break-system-packages yamllint
          npm run lint:yaml

      - name: Run ESLint
        run: npm run lint:js

  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate YAML files
        run: |
          for file in .github/workflows/*.yml .github/ISSUE_TEMPLATE/*.yml .github/dependabot.yml; do
            if [ -f "$file" ]; then
              echo "Validating $file..."
              python3 -c "import yaml; yaml.safe_load(open('$file'))" || exit 1
            fi
          done

      - name: Check shell scripts syntax
        run: |
          for script in install/*.sh; do
            echo "Checking $script..."
            bash -n "$script" || exit 1
          done

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Both platforms, which is what the removed "Installation Test" job used to
        # buy: machine setup (prerequisites, MCP provisioning) now lives in the app
        # under desktop/src/main/setup/, and it branches on platform — Homebrew and
        # the login-shell PATH on macOS, apt package names elsewhere.
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: npm run desktop:install

      - name: Typecheck desktop
        run: cd desktop && npx tsc --noEmit

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract changelog for version
        id: changelog
        run: |
          # Extract the changelog section for this version
          VERSION=${{ steps.version.outputs.VERSION }}
          CHANGELOG=$(sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '1d;$d')

          # Handle multi-line output
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Magic Slash v${{ steps.version.outputs.VERSION }}
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Installation

            Download the `.dmg` below, drag Magic Slash into Applications, and open
            it. The app installs the skills, configures Claude Code and checks your
            prerequisites on first launch — there is nothing else to run.

            ## Full Changelog

            See [CHANGELOG.md](https://github.com/xrequillart/magic-slash/blob/main/CHANGELOG.md) for all changes.
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop:
    name: Build Desktop App
    runs-on: macos-14
    needs: release

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Build, sign, notarize and publish
        working-directory: desktop
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAGIC_SLASH_SUPABASE_URL: ${{ secrets.MAGIC_SLASH_SUPABASE_URL }}
          MAGIC_SLASH_SUPABASE_ANON_KEY: ${{ secrets.MAGIC_SLASH_SUPABASE_ANON_KEY }}

  notify:
    name: Post-Release
    runs-on: ubuntu-latest
    needs: [release, build-desktop]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify the download is reachable
        run: |
          # There is no install script any more — the app configures the machine
          # itself on first launch (desktop/src/main/setup/). What has to be reachable
          # is the download the docs point people at.
          curl -fsSLI -o /dev/null -w '%{http_code}\n' \
            https://github.com/xrequillart/magic-slash/releases/latest | grep -q '^200$'

# A string used to distinguish different Supabase projects on the same host.
# Defaults to the working directory name when running `supabase init`.
project_id = "magic-slash"

[api]
enabled = true
# Port to use for the API URL.
port = 54321
# Schemas to expose in your API. Tables, views and stored procedures in these
# schemas will get API endpoints. `public` and `graphql_public` schemas are
# included by default.
schemas = ["public", "graphql_public"]
# Extra schemas to add to the search_path of every request.
extra_search_path = ["public", "extensions"]
# The maximum number of rows returned from a view, table, or stored procedure.
# Limits payload size for accidental or malicious requests.
max_rows = 1000

[api.tls]
enabled = false

[db]
# Port to use for the local database URL.
port = 54322
# Port used by db diff command to initialize the shadow database.
shadow_port = 54320
# The database major version to use. This has to be the same as your remote
# database's. Run `SHOW server_version;` on the remote database to check.
major_version = 15

[db.pooler]
enabled = false
# Port to use for the local connection pooler.
port = 54329
# Specifies when a server connection can be reused by other clients.
# Configure one of the supported pooler modes: `transaction`, `session`.
pool_mode = "transaction"
# How many server connections to allow per user/database pair.
default_pool_size = 20
# Maximum number of client connections allowed.
max_client_conn = 100

[db.migrations]
# Specifies an ordered list of schema files that describe your database.
schema_paths = []

[realtime]
enabled = true

[studio]
enabled = true
# Port to use for Supabase Studio.
port = 54323
# External URL of the API server that frontend connects to.
api_url = "http://127.0.0.1"

# Email testing server. Emails sent with the local dev setup are not actually
# sent - rather, they are monitored, and you can view the emails that would have
# been sent from the web interface.
[inbucket]
enabled = true
# Port to use for the email testing server web interface.
port = 54324

[storage]
enabled = true
# The maximum file size allowed (e.g. "5MB", "500KB").
file_size_limit = "50MiB"

# ── WHAT DIFFERS BETWEEN THIS MACHINE AND PRODUCTION ─────────────────────────
# `supabase config push` sends this WHOLE [auth] section to the linked project,
# and every value the CLI defaults is part of it — including ones written nowhere
# in this file. A real push against csihmkzqbizblpmawhgt reported SEVEN
# differences, of which only three were addresses; the rest were policy this file
# had never mentioned and would have silently overwritten:
#
#     mfa.totp.enroll_enabled   true  -> false   (MFA switched off in production)
#     mfa.totp.verify_enabled   true  -> false
#     email.max_frequency       1m0s  -> 1s      (email rate limit removed)
#     email.otp_length          8     -> 6
#     email.double_confirm_changes  true -> false
#
# So the rule is not "env() the values that look local". It is: anything that can
# differ must be STATED here, either as env() or as the value production is meant
# to have. A value this file leaves out is not a value left alone — it is the
# CLI's default, pushed.
#
# `supabase/.env` carries the local values and is committed, so `supabase start`,
# `db reset` and `test db` need no setup. A shell variable OVERRIDES that file,
# which is what makes a push with production values possible:
#
#     npm run supabase:config:push -- supabase/.env.production
#
# NEVER run a bare `supabase config push`. It loads supabase/.env — this machine —
# and with a non-interactive stdin it does NOT ask before applying (verified: the
# confirmation prompt is skipped entirely when stdin is not a TTY). The npm script
# above is the guard; it requires an env file and refuses an empty answer.
#
# A missing variable behaves differently per type: a hard parse error on a bool,
# a silent empty string on a string. `enable_confirmations` is therefore the
# canary — a bool, so a missing env file fails the command outright.
[auth]
enabled = true
# The base URL of your website. Used as an allow-list for redirects and for
# constructing URLs used in emails.
site_url = "env(SUPABASE_AUTH_SITE_URL)"
# A list of *exact* URLs that auth providers are permitted to redirect to
# post authentication.
# EMPTY, EVERYWHERE, which is what production already reports. This is the OAuth
# redirect allow-list and nothing in this codebase redirects: no `redirectTo`, no
# `emailRedirectTo`, no OAuth provider — the desktop app signs in with a password
# and confirms with a typed code. It used to hold "https://127.0.0.1:3000" on a
# local server that speaks http, so it had never matched anything either.
#
# Hardcoded rather than env(): an empty list cannot be expressed through a
# variable — `config.toml` needs a string inside the array, and an empty variable
# yields [""] rather than []. One value that is right everywhere beats a variable
# that cannot say the right thing.
additional_redirect_urls = []
# How long tokens are valid for, in seconds. Defaults to 3600 (1 hour).
jwt_expiry = 3600
# If disabled, the refresh token will never expire.
enable_refresh_token_rotation = true
# Allows refresh tokens to be reused after expiry, up to the specified interval
# in seconds. Requires enable_refresh_token_rotation = true.
refresh_token_reuse_interval = 10
# Allow/disallow new user signups to your project.
enable_signup = true
# Allow/disallow anonymous sign-ins to your project.
enable_anonymous_sign_ins = false

# STATED BECAUSE A PUSH SENDS IT EITHER WAY. Production has TOTP enrolment on and
# this file said nothing, so the CLI offered its own default — false — and a push
# would have turned MFA off for everyone. Written out and set to what production
# already is, so the diff is empty rather than dangerous. Nothing local needs it
# off.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
# Allow/disallow new user signups via email to your project.
enable_signup = true
# How long a sender must wait between two auth emails. One second locally, because
# testing a flow means sending several in a row; a minute in production, which is
# what it is already set to. STATED rather than left to the default, which is the
# lesson of the push that would have dropped production to one second.
max_frequency = "env(SUPABASE_AUTH_EMAIL_MAX_FREQUENCY)"
# The number of digits in an emailed code. SIX EVERYWHERE, because the app says so
# in as many words — `cloud.email.codePlaceholder` reads "6-digit code" and the
# password reset says the same. Production is currently on EIGHT, which means the
# code a user is emailed today does not fit the sentence asking for it. Pushing
# this fixes that; it is a deliberate change to production, not an address.
otp_length = 6
# If enabled, a user will be required to confirm any email change on both the
# old, and new email addresses. If disabled, only the new email is required to
# confirm.
# Kept FALSE on purpose: the desktop app confirms an email change with a single
# 6-digit OTP typed into the app (see confirmEmailChange). With double-confirm on,
# verifying only the new-address code would leave the change pending while the UI
# reported success. Single-address confirmation still requires a live session +
# access to the new inbox.
double_confirm_changes = false
# If enabled, users need to confirm their email address before signing in.
#
# THE ONE VALUE HERE THAT IS A DIFFERENCE OF POLICY rather than of address, and
# the canary described at the top of [auth]: a bool, so a missing env file stops
# the command instead of pushing a guess at what production signup policy is.
#
# It does NOT govern email CHANGES. GoTrue confirms those whatever this says —
# verified against the running server, which answers updateUser({email}) with
# the address unchanged and `new_email` left pending. The 6-digit code in the
# change-email dialog is not optional decoration.
enable_confirmations = "env(SUPABASE_AUTH_EMAIL_CONFIRMATIONS)"

# Email templates. The desktop app uses Supabase's 6-digit OTP code flow (no deep
# links / no custom protocol): the user is emailed a code and types it into the
# app. Both templates MUST include {{ .Token }} so the code is actually delivered.
[auth.email.template.recovery]
subject = "Reset your Magic Slash password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your new Magic Slash email"
content_path = "./supabase/templates/email_change.html"

[analytics]
enabled = false

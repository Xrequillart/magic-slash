<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>Magic Slash - Popover</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    /* No `color` here on purpose: the panel paints its own text from theme
       tokens, and a hardcoded white would show through on a light theme.
       No height either — the panel measures itself and the window is resized to
       match (see resizePopover), so anything stretching this to 100% would
       feed the measurement its own window height. */
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: "Cera Pro", -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/renderer/popover-main.tsx"></script>
</body>
</html>
